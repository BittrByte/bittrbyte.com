<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thank You | BittrByte</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#f5f5f7" />
  <link rel="icon" type="image/png" sizes="48x48" href="images/favicon-48.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <style>
    .thanks { min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 24px; }
    .thanks img { height: 28px; margin: 0 auto 32px; }
    .thanks .check { width: 64px; height: 64px; margin: 0 auto 24px; border-radius: 50%; border: 1px solid var(--accent-line); background: var(--surface); display: flex; align-items: center; justify-content: center; }
    .thanks .check svg { width: 28px; height: 28px; stroke: var(--text); fill: none; stroke-width: 2.2; }
    .thanks h1 { font-size: clamp(28px, 5vw, 42px); margin-bottom: 16px; }
    .thanks p { color: var(--muted); font-size: 17px; margin-bottom: 32px; max-width: 480px; }
  </style>
</head>
<body style="padding-top:0;">
  <section class="thanks">
    <a href="index.html" aria-label="BittrByte home"><img src="images/Black_Logo.svg" alt="BittrByte" /></a>
    <div class="check" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg></div>
    <h1>Thank you.</h1>
    <p>We've received your message and will be in touch.</p>
