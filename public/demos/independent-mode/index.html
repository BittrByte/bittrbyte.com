<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skywall OS - Independent Mode</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/independent.css">
</head>
<body>
    <div class="independent-container">
        <div class="branding">
            <h1>Independent Mode</h1>
            <p class="subtitle">Devices independently create and enforce their own policies</p>
        </div>
        
        <div class="visualization-area">
            <!-- Desktop -->
            <div class="device-item">
                <div class="device-svg-container desktop-container">
                    <svg viewBox="0 0 300 280" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="standMetal" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" style="stop-color:#2a2a2a;stop-opacity:1" />
                                <stop offset="20%" style="stop-color:#3a3a3a;stop-opacity:1" />
                                <stop offset="50%" style="stop-color:#4a4a4a;stop-opacity:1" />
                                <stop offset="80%" style="stop-color:#3a3a3a;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#2a2a2a;stop-opacity:1" />
                            </linearGradient>
                            <linearGradient id="screenGlassDesktop" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.1" />
                                <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.02" />
                                <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
                            </linearGradient>
                        </defs>
                        <!-- Stand Neck -->
                        <rect x="120" y="160" width="60" height="70" fill="url(#standMetal)"/>
                        <!-- Base -->
                        <path d="M 100 230 L 200 230 Q 205 230 205 235 L 205 238 Q 205 240 200 240 L 100 240 Q 95 240 95 238 L 95 235 Q 95 230 100 230 Z" fill="url(#standMetal)"/>
                        
                        <!-- Monitor Frame -->
                        <rect x="20" y="20" width="260" height="180" rx="12" fill="#000" stroke="#222" stroke-width="1"/>
                        <!-- Screen -->
                        <rect x="25" y="25" width="250" height="170" rx="4" fill="#050505"/>
                        <!-- Reflection -->
                        <path d="M 25 25 L 275 25 L 25 195 Z" fill="url(#screenGlassDesktop)"/>
                        
                        <!-- SKYWALL Text -->
                        <text x="150" y="115" text-anchor="middle" fill="#FFFFFF" font-family="Montserrat, sans-serif" font-size="24" font-weight="400" letter-spacing="2">SKYWALL</text>
                    </svg>
                </div>
                <div class="device-label">Desktop</div>
            </div>

            <!-- Phone -->
            <div class="device-item">
                <div class="device-svg-container phone-container">
                    <svg viewBox="0 0 220 440" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="phoneFrame" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" style="stop-color:#333;stop-opacity:1" />
                                <stop offset="10%" style="stop-color:#111;stop-opacity:1" />
                                <stop offset="90%" style="stop-color:#111;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#333;stop-opacity:1" />
                            </linearGradient>
                            <linearGradient id="phoneGlass" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#fff;stop-opacity:0.05" />
                                <stop offset="40%" style="stop-color:#fff;stop-opacity:0" />
                            </linearGradient>
                        </defs>
                        
                        <!-- Outer Frame -->
                        <rect x="10" y="10" width="200" height="420" rx="45" fill="url(#phoneFrame)"/>
                        <!-- Black Bezel Border -->
                        <rect x="15" y="15" width="190" height="410" rx="40" fill="#000"/>
                        <!-- Screen -->
                        <rect x="22" y="22" width="176" height="396" rx="35" fill="#050505"/>
                        
                        <!-- Reflection -->
                        <path d="M 22 22 L 198 22 L 22 418 Z" fill="url(#phoneGlass)"/>
                        
                        <!-- Dynamic Island / Notch -->
                        <rect x="75" y="30" width="70" height="20" rx="10" fill="#000"/>
                        
                        <!-- Side Buttons -->
                        <rect x="2" y="120" width="3" height="40" rx="1.5" fill="#222"/>
                        <rect x="215" y="150" width="3" height="70" rx="1.5" fill="#222"/>
                        
                        <!-- SKYWALL Text -->
                        <text x="110" y="230" text-anchor="middle" fill="#FFFFFF" font-family="Montserrat, sans-serif" font-size="16" font-weight="400" letter-spacing="1.5">SKYWALL</text>
                    </svg>
                </div>
                <div class="device-label">Phone</div>
            </div>

            <!-- Laptop -->
            <div class="device-item">
                <div class="device-svg-container laptop-container">
                    <svg viewBox="0 0 400 240" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <!-- Metallic Aluminum Gradient -->
                            <linearGradient id="laptopMetal" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" style="stop-color:#4a4a4a;stop-opacity:1" />
                                <stop offset="5%" style="stop-color:#3a3a3a;stop-opacity:1" />
                                <stop offset="95%" style="stop-color:#2a2a2a;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
                            </linearGradient>
                            <!-- Glossy Screen Reflection -->
                            <linearGradient id="screenGlassLaptop" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.1" />
                                <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.02" />
                                <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
                            </linearGradient>
                        </defs>
                        
                        <!-- Base/Keyboard Deck -->
                        <path d="M 40 200 L 360 200 L 360 215 Q 360 225 350 225 L 50 225 Q 40 225 40 215 Z" fill="url(#laptopMetal)" />
                        <path d="M 40 200 L 360 200 L 360 205 L 40 205 Z" fill="#1a1a1a" opacity="0.5"/>
                        
                        <!-- Screen Lid -->
                        <rect x="50" y="20" width="300" height="185" rx="12" fill="url(#laptopMetal)" stroke="#222" stroke-width="1"/>
                        
                        <!-- Black Bezel -->
                        <rect x="52" y="22" width="296" height="181" rx="8" fill="#000"/>
                        
                        <!-- Screen Area -->
                        <rect x="56" y="26" width="288" height="173" fill="#050505"/>
                        
                        <!-- Webcam Notch Area -->
                        <path d="M 185 26 L 215 26 L 212 34 L 188 34 Z" fill="#000"/>
                        
                        <!-- Reflection -->
                        <path d="M 56 26 L 344 26 L 56 200 Z" fill="url(#screenGlassLaptop)"/>
                        
                        <!-- Trackpad -->
                        <rect x="160" y="208" width="80" height="12" rx="2" fill="#000" opacity="0.2"/>
                        
                        <!-- Keyboard cutout hint -->
                        <rect x="60" y="202" width="280" height="2" fill="#000" opacity="0.3"/>
                        
                        <!-- SKYWALL Text -->
                        <text x="200" y="120" text-anchor="middle" fill="#FFFFFF" font-family="Montserrat, sans-serif" font-size="20" font-weight="400" letter-spacing="2">SKYWALL</text>
                    </svg>
                </div>
                <div class="device-label">Laptop</div>
            </div>

            <!-- Tablet -->
            <div class="device-item">
                <div class="device-svg-container tablet-container">
                    <svg viewBox="0 0 200 280" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="tabletMetal" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#333;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#111;stop-opacity:1" />
                            </linearGradient>
                            <linearGradient id="tabletGlass" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#fff;stop-opacity:0.08" />
                                <stop offset="100%" style="stop-color:#fff;stop-opacity:0" />
                            </linearGradient>
                        </defs>
                        <!-- Frame -->
                        <rect x="10" y="10" width="180" height="260" rx="16" fill="url(#tabletMetal)" stroke="#2a2a2a" stroke-width="1"/>
                        <!-- Bezel -->
                        <rect x="12" y="12" width="176" height="256" rx="14" fill="#000"/>
                        <!-- Screen -->
                        <rect x="18" y="18" width="164" height="244" rx="8" fill="#050505"/>
                        <!-- Reflection -->
                        <rect x="18" y="18" width="164" height="244" rx="8" fill="url(#tabletGlass)"/>
                        <!-- Camera -->
                        <circle cx="100" cy="15" r="2" fill="#1a1a1a"/>
                        <circle cx="100" cy="15" r="1" fill="#2a3a4a"/>
                        <!-- Home Indicator -->
                        <rect x="80" y="255" width="40" height="3" rx="1.5" fill="#333"/>
                        
                        <!-- SKYWALL Text -->
                        <text x="100" y="145" text-anchor="middle" fill="#FFFFFF" font-family="Montserrat, sans-serif" font-size="18" font-weight="400" letter-spacing="1.5">SKYWALL</text>
                    </svg>
                </div>
                <div class="device-label">Tablet</div>
            </div>
        </div>
    </div>
</body>
</html>
