<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyWall OS - 3D Manhattan Demo</title>
    
    <!-- MapLibre GL JS (Open Source, No API Key Required) -->
    <link href="https://unpkg.com/maplibre-gl@4.0.0/dist/maplibre-gl.css" rel="stylesheet">
    <script src="https://unpkg.com/maplibre-gl@4.0.0/dist/maplibre-gl.js"></script>
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/map3d.css">
</head>
<body>
    <!-- Loading Screen -->
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <div class="loading-text">Loading 3D Manhattan...</div>
    </div>

    <!-- Header -->
    <div class="header">
        <div class="logo">SKYWALL</div>
        <div class="title">3D Manhattan Geofencing Visualization</div>
    </div>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Control Panel -->
    <div class="controls">
        <div class="control-group">
            <button class="btn" id="btn-overview">Overview</button>
            <button class="btn" id="btn-street">Street Level</button>
            <button class="btn" id="btn-aerial">Aerial</button>
        </div>
        
        <div class="divider"></div>
        
        <div class="control-group">
            <button class="toggle-btn active" id="btn-restriction">
                🔴 Restriction Zones
            </button>
            <button class="toggle-btn enforcement active" id="btn-enforcement">
                ⚪ Enforcement Zones
            </button>
        </div>
        
        <div class="divider"></div>
        
        <div class="control-group">
            <button class="btn" id="btn-reset">Reset View</button>
        </div>
    </div>

    <!-- Info Panel -->
    <div class="info-panel">
        <h3>Legend</h3>
        <div class="info-item">
            <div class="color-indicator red"></div>
            <div class="info-text">Restriction Zones - Apps blocked in these areas</div>
        </div>
        <div class="info-item">
            <div class="color-indicator white"></div>
            <div class="info-text">Enforcement Zones - Editable time restrictions</div>
        </div>
    </div>

    <!-- Instructions -->
    <div class="instructions">
        <h3>Controls</h3>
        <div class="instruction-item">
            <strong>Drag</strong>
            <span>Pan the map</span>
        </div>
        <div class="instruction-item">
            <strong>Scroll</strong>
            <span>Zoom in/out</span>
        </div>
        <div class="instruction-item">
            <strong>Right-click + Drag</strong>
            <span>Rotate & tilt view</span>
        </div>
        <div class="instruction-item">
            <strong>Ctrl + Drag</strong>
            <span>Rotate around center</span>
        </div>
    </div>

    <!-- Main Script -->
    <script>
        // Using MapLibre - no API key needed, free OSM data
        let map;
        let restrictionZonesVisible = true;
        let enforcementZonesVisible = true;

        // Zone definitions (matching your Manhattan enforcement demo)
        const restrictionZones = [
            {
                id: 'wtc-restriction',
                name: 'World Trade Center',
                center: [40.7127, -74.0134],
                radius: 500, // meters
                apps: ['Instagram', 'Snapchat', 'TikTok']
            },
            {
                id: 'times-square-restriction',
                name: 'Times Square',
                center: [40.7580, -73.9855],
                radius: 400,
                apps: ['Instagram', 'Snapchat']
            }
        ];

        const enforcementZones = [
            {
                id: 'upper-east-restriction',
                name: 'Upper East Side Home',
                center: [40.7736, -73.9566],
                radius: 300,
                schedule: '22:00 - 08:00'
            },
            {
                id: 'chelsea-restriction',
                name: 'Chelsea Apartment',
                center: [40.7465, -74.0014],
                radius: 250,
                schedule: '23:00 - 07:00'
            }
        ];

        // Initialize map with real OSM 3D buildings
        function initMap() {
            map = new maplibregl.Map({
                container: 'map',
                style: createGrayscaleStyle(),
                center: [-73.9855, 40.7580],
                zoom: 13.5,
                pitch: 60,
                bearing: -17.6,
                antialias: true
            });

            map.on('load', () => {
                document.getElementById('loading').style.display = 'none';
                
                // Add 3D buildings using real OSM data
                add3DBuildings();
                
                addRestrictionZones();
                addEnforcementZones();
                setupControls();
            });

            map.addControl(new maplibregl.NavigationControl(), 'top-right');
        }

        // Create grayscale style with Protomaps OSM data
        function createGrayscaleStyle() {
            return {
                version: 8,
                name: 'Grayscale Manhattan',
                sources: {
                    'protomaps': {
                        type: 'vector',
                        tiles: ['https://api.protomaps.com/tiles/v3/{z}/{x}/{y}.mvt?key=41392fb7515533a5'],
                        attribution: '© OpenStreetMap',
                        maxzoom: 15
                    }
                },
                layers: [
                    {
                        id: 'background',
                        type: 'background',
                        paint: { 'background-color': '#1a1a1a' }
                    },
                    {
                        id: 'water',
                        type: 'fill',
                        source: 'protomaps',
                        'source-layer': 'water',
                        paint: { 'fill-color': '#2a2a2a' }
                    },
                    {
                        id: 'landuse',
                        type: 'fill',
                        source: 'protomaps',
                        'source-layer': 'landuse',
                        paint: { 'fill-color': '#3a3a3a' }
                    },
                    {
                        id: 'roads',
                        type: 'line',
                        source: 'protomaps',
                        'source-layer': 'roads',
                        paint: {
                            'line-color': '#5a5a5a',
                            'line-width': ['interpolate', ['linear'], ['zoom'], 10, 0.5, 16, 4]
                        }
                    },
                    {
                        id: 'buildings-flat',
                        type: 'fill',
                        source: 'protomaps',
                        'source-layer': 'buildings',
                        paint: {
                            'fill-color': '#555555',
                            'fill-opacity': 0.6
                        }
                    }
                ]
            };
        }

        // Add 3D buildings - using REAL OSM heights, NO exaggerations
        function add3DBuildings() {
            map.addLayer({
                'id': '3d-buildings',
                'source': 'protomaps',
                'source-layer': 'buildings',
                'type': 'fill-extrusion',
                'minzoom': 11,
                'paint': {
                    'fill-extrusion-color': [
                        'interpolate',
                        ['linear'],
                        ['coalesce', ['to-number', ['get', 'height']], 15],
                        0, '#cccccc',
                        50, '#bbbbbb',
                        100, '#aaaaaa',
                        200, '#999999',
                        300, '#888888',
                        400, '#777777',
                        500, '#666666'
                    ],
                    // Use exact OSM height data - no modifications
                    'fill-extrusion-height': [
                        'case',
                        ['has', 'height'],
                        ['to-number', ['get', 'height']],
                        15 // fallback for buildings without height data
                    ],
                    'fill-extrusion-base': 0,
                    'fill-extrusion-opacity': 0.9
                }
            });

            // Log to help debug what building data we're getting
            map.on('click', '3d-buildings', (e) => {
                if (e.features.length > 0) {
                    const props = e.features[0].properties;
                    console.log('Building clicked:', props);
                    
                    // Show popup with building info
                    new maplibregl.Popup()
                        .setLngLat(e.lngLat)
                        .setHTML(`
                            <div style="color: #000; padding: 10px;">
                                <h3 style="margin: 0 0 8px 0; font-size: 14px; font-weight: 600;">
                                    ${props.name || 'Building'}
                                </h3>
                                <p style="margin: 0; font-size: 12px; color: #666;">
                                    ${props.height ? '<strong>Height:</strong> ' + props.height + 'm<br>' : ''}
                                    ${props['building:levels'] ? '<strong>Levels:</strong> ' + props['building:levels'] : ''}
                                </p>
                            </div>
                        `)
                        .addTo(map);
                }
            });

            map.on('mouseenter', '3d-buildings', () => {
                map.getCanvas().style.cursor = 'pointer';
            });
            map.on('mouseleave', '3d-buildings', () => {
                map.getCanvas().style.cursor = '';
            });
        }

        // Create dome geometry (approximation using circle)
        function createDomeGeometry(center, radius) {
            const points = 64;
            const coords = [];
            
            for (let i = 0; i < points; i++) {
                const angle = (i / points) * Math.PI * 2;
                const lat = center[0] + (radius / 111320) * Math.cos(angle);
                const lng = center[1] + (radius / (111320 * Math.cos(center[0] * Math.PI / 180))) * Math.sin(angle);
                coords.push([lng, lat]);
            }
            coords.push(coords[0]); // Close the polygon

            return {
                type: 'Feature',
                geometry: {
                    type: 'Polygon',
                    coordinates: [coords]
                }
            };
        }

        // Add restriction zones (red domes)
        function addRestrictionZones() {
            restrictionZones.forEach((zone, index) => {
                const sourceId = `restriction-source-${index}`;
                const layerId = `restriction-layer-${index}`;
                
                // Add source
                map.addSource(sourceId, {
                    type: 'geojson',
                    data: createDomeGeometry(zone.center, zone.radius)
                });

                // Add 3D dome layer
                map.addLayer({
                    id: layerId,
                    type: 'fill-extrusion',
                    source: sourceId,
                    paint: {
                        'fill-extrusion-color': '#E53935',
                        'fill-extrusion-height': zone.radius * 1.5, // Dome height
                        'fill-extrusion-base': 0,
                        'fill-extrusion-opacity': 0.35
                    }
                });

                // Add popup on click
                map.on('click', layerId, (e) => {
                    new maplibregl.Popup()
                        .setLngLat(e.lngLat)
                        .setHTML(`
                            <div style="color: #000; padding: 10px;">
                                <h3 style="margin: 0 0 8px 0; font-size: 14px; font-weight: 600;">
                                    ${zone.name}
                                </h3>
                                <p style="margin: 0; font-size: 12px; color: #666;">
                                    <strong>Restricted Apps:</strong><br>
                                    ${zone.apps.join(', ')}
                                </p>
                                <p style="margin: 8px 0 0 0; font-size: 11px; color: #E53935;">
                                    🔴 Restriction Zone
                                </p>
                            </div>
                        `)
                        .addTo(map);
                });

                // Change cursor on hover
                map.on('mouseenter', layerId, () => {
                    map.getCanvas().style.cursor = 'pointer';
                });
                map.on('mouseleave', layerId, () => {
                    map.getCanvas().style.cursor = '';
                });
            });
        }

        // Add enforcement zones (white/gray domes)
        function addEnforcementZones() {
            enforcementZones.forEach((zone, index) => {
                const sourceId = `enforcement-source-${index}`;
                const layerId = `enforcement-layer-${index}`;
                
                // Add source
                map.addSource(sourceId, {
                    type: 'geojson',
                    data: createDomeGeometry(zone.center, zone.radius)
                });

                // Add 3D dome layer
                map.addLayer({
                    id: layerId,
                    type: 'fill-extrusion',
                    source: sourceId,
                    paint: {
                        'fill-extrusion-color': '#ffffff',
                        'fill-extrusion-height': zone.radius * 1.5, // Dome height
                        'fill-extrusion-base': 0,
                        'fill-extrusion-opacity': 0.6
                    }
                });

                // Add popup on click
                map.on('click', layerId, (e) => {
                    new maplibregl.Popup()
                        .setLngLat(e.lngLat)
                        .setHTML(`
                            <div style="color: #000; padding: 10px;">
                                <h3 style="margin: 0 0 8px 0; font-size: 14px; font-weight: 600;">
                                    ${zone.name}
                                </h3>
                                <p style="margin: 0; font-size: 12px; color: #666;">
                                    <strong>Schedule:</strong> ${zone.schedule}
                                </p>
                                <p style="margin: 8px 0 0 0; font-size: 11px; color: #666;">
                                    ⚪ Enforcement Zone
                                </p>
                            </div>
                        `)
                        .addTo(map);
                });

                // Change cursor on hover
                map.on('mouseenter', layerId, () => {
                    map.getCanvas().style.cursor = 'pointer';
                });
                map.on('mouseleave', layerId, () => {
                    map.getCanvas().style.cursor = '';
                });
            });
        }

        // Setup controls
        function setupControls() {
            // View preset buttons
            document.getElementById('btn-overview').addEventListener('click', () => {
                map.flyTo({
                    center: [-73.9855, 40.7580],
                    zoom: 13.5,
                    pitch: 60,
                    bearing: -17.6,
                    duration: 2000
                });
            });

            document.getElementById('btn-street').addEventListener('click', () => {
                map.flyTo({
                    center: [-73.9855, 40.7580],
                    zoom: 16,
                    pitch: 70,
                    bearing: 45,
                    duration: 2000
                });
            });

            document.getElementById('btn-aerial').addEventListener('click', () => {
                map.flyTo({
                    center: [-73.9855, 40.7580],
                    zoom: 12,
                    pitch: 0,
                    bearing: 0,
                    duration: 2000
                });
            });

            document.getElementById('btn-reset').addEventListener('click', () => {
                map.flyTo({
                    center: [-73.9855, 40.7580],
                    zoom: 13.5,
                    pitch: 60,
                    bearing: -17.6,
                    duration: 2000
                });
            });

            // Toggle restriction zones
            document.getElementById('btn-restriction').addEventListener('click', () => {
                restrictionZonesVisible = !restrictionZonesVisible;
                const btn = document.getElementById('btn-restriction');
                
                restrictionZones.forEach((zone, index) => {
                    const layerId = `restriction-layer-${index}`;
                    map.setLayoutProperty(
                        layerId,
                        'visibility',
                        restrictionZonesVisible ? 'visible' : 'none'
                    );
                });

                btn.classList.toggle('active', restrictionZonesVisible);
            });

            // Toggle enforcement zones
            document.getElementById('btn-enforcement').addEventListener('click', () => {
                enforcementZonesVisible = !enforcementZonesVisible;
                const btn = document.getElementById('btn-enforcement');
                
                enforcementZones.forEach((zone, index) => {
                    const layerId = `enforcement-layer-${index}`;
                    map.setLayoutProperty(
                        layerId,
                        'visibility',
                        enforcementZonesVisible ? 'visible' : 'none'
                    );
                });

                btn.classList.toggle('active', enforcementZonesVisible);
            });
        }

        // Initialize on page load
        window.addEventListener('load', initMap);
    </script>
</body>
</html>
