<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skywall OS - Manhattan Enforcement Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/phone.css">
    <link rel="stylesheet" href="css/boot.css">
    <link rel="stylesheet" href="css/homescreen.css">
    <link rel="stylesheet" href="css/controlpanel.css">
    <link rel="stylesheet" href="css/chat.css">
    <link rel="stylesheet" href="css/dropdown.css">
    <link rel="stylesheet" href="css/sidemenu.css">
    <link rel="stylesheet" href="css/map.css">
    <link rel="stylesheet" href="css/settings.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/tour.css">
</head>
<script>if(location.search.includes('embed=1')) document.documentElement.style.setProperty('--body-bg','transparent');</script>
<style>body{background:var(--body-bg, #ffffff) !important;}</style>
<body>
    <!-- Phone Container -->
    <div id="phone-container">
        <div id="demo-blocker"></div>
        <!-- Boot Screen -->
        <div id="boot-screen" class="screen active">
            <div class="boot-logo">SKYWALL</div>
        </div>

        <!-- Home Screen -->
        <div id="home-screen" class="screen">
            <!-- Status Bar -->
            <div class="status-bar">
                <div class="status-left">
                    <span class="time">11:00</span>
                </div>
                <div class="status-right">
                    <span class="icon-signal">
                        <svg viewBox="0 0 24 24">
                            <rect x="2" y="16" width="3" height="6" rx="1" fill="currentColor"/>
                            <rect x="7" y="12" width="3" height="10" rx="1" fill="currentColor"/>
                            <rect x="12" y="8" width="3" height="14" rx="1" fill="currentColor"/>
                            <rect x="17" y="4" width="3" height="18" rx="1" fill="currentColor"/>
                        </svg>
                    </span>
                    <span class="icon-wifi">
                        <svg viewBox="0 0 24 24">
                            <path d="M2 8c5.333-5.333 14.667-5.333 20 0" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
                            <path d="M6 12c3.111-3.111 8.889-3.111 12 0" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
                            <path d="M10 16c1.556-1.556 3.444-1.556 5 0" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
                            <circle cx="12" cy="19" r="1.5" fill="currentColor"/>
                        </svg>
                    </span>
                    <span class="icon-battery">
                        <svg viewBox="0 0 24 24">
                            <rect x="2" y="7" width="18" height="10" rx="2" stroke="currentColor" stroke-width="1.5" fill="none"/>
                            <rect x="5" y="9.5" width="12" height="5" rx="1" fill="currentColor"/>
                            <rect x="20" y="10" width="2" height="4" rx="1" fill="currentColor"/>
                        </svg>
                    </span>
                </div>
            </div>

            <!-- App Pages Container -->
            <div class="app-pages-wrapper">
                <div class="app-pages" id="app-pages">
                    <!-- Page 1 -->
                    <div class="app-page">
                        <div class="app-grid" id="app-grid-1"></div>
                    </div>
                    <!-- Page 2 -->
                    <div class="app-page">
                        <div class="app-grid" id="app-grid-2"></div>
                    </div>
                </div>
            </div>

            <!-- Page Indicators -->
            <div class="page-indicators">
                <span class="dot active"></span>
                <span class="dot"></span>
            </div>

            <!-- Living Indicator -->
            <div class="living-indicator" id="living-indicator">
                <div class="blob blob-1"></div>
                <div class="blob blob-2"></div>
                <div class="blob blob-3"></div>
            </div>
        </div>

        <!-- Control Panel -->
        <div id="control-panel" class="overlay">
            <div class="control-panel-content">
                <div class="control-header">
                    <div class="control-drag-handle"></div>
                </div>
                <div class="quick-settings-grid">
                    <div class="quick-setting" data-setting="wifi">
                        <div class="setting-icon">
                            <svg viewBox="0 0 24 24">
                                <path d="M2 8c5.333-5.333 14.667-5.333 20 0"/>
                                <path d="M6 12c3.111-3.111 8.889-3.111 12 0"/>
                                <path d="M10 16c1.556-1.556 3.444-1.556 5 0"/>
                                <circle cx="12" cy="19" r="1.2" fill="currentColor"/>
                            </svg>
                        </div>
                        <div class="setting-label">WiFi</div>
                        <div class="setting-status">Home Network</div>
                    </div>
                    <div class="quick-setting" data-setting="data">
                        <div class="setting-icon">
                            <svg viewBox="0 0 24 24">
                                <path d="M4 20v-6"/>
                                <path d="M10 20V4"/>
                                <path d="M16 20V8"/>
                                <path d="M22 20v-10"/>
                            </svg>
                        </div>
                        <div class="setting-label">Mobile Data</div>
                        <div class="setting-status">On</div>
                    </div>
                    <div class="quick-setting" data-setting="bluetooth">
                        <div class="setting-icon">
                            <svg viewBox="0 0 24 24">
                                <path d="M7 7l10 10-5 4V3l5 4-10 10"/>
                            </svg>
                        </div>
                        <div class="setting-label">Bluetooth</div>
                        <div class="setting-status">Off</div>
                    </div>
                    <div class="quick-setting" data-setting="airplane">
                        <div class="setting-icon">
                            <svg viewBox="0 0 24 24">
                                <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z" fill="currentColor"/>
                            </svg>
                        </div>
                        <div class="setting-label">Airplane</div>
                        <div class="setting-status">Off</div>
                    </div>
                    <div class="quick-setting" data-setting="dnd">
                        <div class="setting-icon">
                            <svg viewBox="0 0 24 24">
                                <circle cx="12" cy="12" r="7"/>
                                <line x1="8" y1="12" x2="16" y2="12"/>
                            </svg>
                        </div>
                        <div class="setting-label">Do Not Disturb</div>
                        <div class="setting-status">Off</div>
                    </div>
                    <div class="quick-setting" data-setting="rotation">
                        <div class="setting-icon">
                            <svg viewBox="0 0 24 24">
                                <path d="M7 9V7a2 2 0 0 1 2-2h8"/>
                                <path d="M17 15v2a2 2 0 0 1-2 2H7"/>
                                <path d="M7 9l-2-2"/>
                                <path d="M17 15l2 2"/>
                            </svg>
                        </div>
                        <div class="setting-label">Auto-Rotate</div>
                        <div class="setting-status">On</div>
                    </div>
                </div>
                <div class="brightness-control">
                    <div class="brightness-icon">
                        <svg viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="4"/>
                            <line x1="12" y1="3" x2="12" y2="1"/>
                            <line x1="12" y1="23" x2="12" y2="21"/>
                            <line x1="4.22" y1="4.22" x2="2.81" y2="2.81"/>
                            <line x1="21.19" y1="21.19" x2="19.78" y2="19.78"/>
                            <line x1="3" y1="12" x2="1" y2="12"/>
                            <line x1="23" y1="12" x2="21" y2="12"/>
                            <line x1="4.22" y1="19.78" x2="2.81" y2="21.19"/>
                            <line x1="21.19" y1="2.81" x2="19.78" y2="4.22"/>
                        </svg>
                    </div>
                    <input type="range" class="brightness-slider" min="0" max="100" value="75">
                </div>
            </div>
        </div>

        <!-- Skywall Chat Interface -->
        <div id="skywall-chat" class="overlay">
            <div class="chat-container">
                <div class="chat-header">
                    <button class="header-btn menu-btn" id="menu-btn" aria-label="Open menu">
                        <span class="menu-icon">
                            <span></span>
                            <span></span>
                            <span></span>
                        </span>
                    </button>
                    <div class="header-center">
                        <div class="device-selector" id="device-selector">
                            <span class="device-icon"></span>
                            <span class="device-label">Phone (Parent)</span>
                            <span class="dropdown-arrow">▼</span>
                        </div>
                    </div>
                    <button class="header-btn new-chat-btn" id="new-chat-btn">+</button>
                </div>
                <div class="chat-title">
                    <h1>SKYWALL</h1>
                    <p class="chat-subtitle">Your Tech, <em>Your Choice</em></p>
                </div>
                <div class="chat-messages" id="chat-messages"></div>
                <div class="chat-lock-info" id="chat-lock-info" style="display: none;">
                    <svg class="lock-icon-svg" viewBox="0 0 24 24" width="16" height="16">
                        <rect x="5" y="11" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
                        <path d="M8 11V7a4 4 0 0 1 8 0v4" fill="none" stroke="currentColor" stroke-width="2"/>
                    </svg>
                    <span class="lock-info-text"></span>
                </div>
                <div class="chat-input-container">
                    <textarea class="chat-input" id="chat-input" placeholder="Message SKYWALL..." rows="1"></textarea>
                    <button class="send-btn" id="send-btn">➤</button>
                </div>
                <button class="close-chat-btn" id="close-chat-btn">×</button>
            </div>
        </div>

        <!-- Device Dropdown Menu -->
        <div id="device-dropdown" class="dropdown-menu">
            <div class="dropdown-item" data-device="phone">
                <span class="device-icon-lg"></span>
                <span>Phone (Parent)</span>
            </div>
            <div class="dropdown-item" data-device="laptop">
                <span class="device-icon-lg"></span>
                <span>Laptop</span>
            </div>
            <div class="dropdown-item" data-device="desktop">
                <span class="device-icon-lg"></span>
                <span>Desktop</span>
            </div>
            <div class="dropdown-item" data-device="tablet">
                <span class="device-icon-lg"></span>
                <span>Tablet</span>
            </div>
            <div class="dropdown-item" data-device="watch">
                <span class="device-icon-lg"></span>
                <span>Smartwatch</span>
            </div>
            <div class="dropdown-item" data-device="console">
                <span class="device-icon-lg"></span>
                <span>Console</span>
            </div>
        </div>

        <!-- Side Menu -->
        <div id="side-menu" class="side-overlay">
            <div class="side-menu-content">
                <div class="side-menu-header">
                    <span class="side-menu-title">SKYWALL</span>
                    <button class="side-header-btn map-btn" id="map-btn">
                        <svg viewBox="0 0 24 24">
                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                            <circle cx="12" cy="10" r="3"/>
                        </svg>
                    </button>
                    <button class="side-header-btn settings-btn" id="settings-btn">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                        </svg>
                    </button>
                </div>
                <div class="chat-history" id="chat-history">
                    <!-- Chat history items will be populated by JS -->
                </div>
            </div>
        </div>

        <!-- Map View -->
        <div id="map-view" class="screen-overlay">
            <div class="map-header">
                <button class="back-btn" id="map-back-btn">←</button>
                <input type="text" class="map-search" id="map-search" placeholder="Search Manhattan locations...">
            </div>
            <div id="map-container"></div>
            <div class="map-search-results" id="map-search-results"></div>
        </div>

        <!-- Settings Screen -->
        <div id="settings-screen" class="screen-overlay">
            <div class="settings-header">
                <button class="back-btn" id="settings-back-btn">←</button>
                <h2>Settings</h2>
            </div>
            <div class="settings-content" id="settings-content"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/state.js"></script>
    <script src="js/enforcement.js"></script>
    <script src="js/boot.js"></script>
    <script src="js/homescreen.js"></script>
    <script src="js/controlpanel.js"></script>
    <script src="js/skywall-chat.js"></script>
    <script src="js/device-dropdown.js"></script>
    <script src="js/sidemenu.js"></script>
    <script src="js/map.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/main.js"></script>
    <script src="js/manhattan-enforcement-policies.js"></script>
    <script src="js/manhattan-enforcement-demo.js"></script>
</body>
</html>
