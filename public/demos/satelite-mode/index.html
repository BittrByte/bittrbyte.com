<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skywall OS - Ecosystem</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/ecosystem.css">
</head>
<body>
    <div class="ecosystem-container">
        
        <div class="visualization-area">
            <!-- Parent Device in Center -->
            <div class="center-parent" id="center-parent">
                <!-- Content populated by JS -->
            </div>

            <!-- Circling Devices -->
            <div class="device-circle device-0" data-device="child-phone">
                <div class="device-svg-container phone-circle-container">
                    <svg viewBox="0 0 220 440" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="phoneFrameCircle" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" style="stop-color:#333;stop-opacity:1" />
                                <stop offset="10%" style="stop-color:#111;stop-opacity:1" />
                                <stop offset="90%" style="stop-color:#111;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#333;stop-opacity:1" />
                            </linearGradient>
                        </defs>
                        <rect x="10" y="10" width="200" height="420" rx="45" fill="url(#phoneFrameCircle)"/>
                        <rect x="15" y="15" width="190" height="410" rx="40" fill="#000"/>
                        <rect x="22" y="22" width="176" height="396" rx="35" fill="#050505"/>
                        <path d="M 22 22 L 198 22 L 22 418 Z" fill="url(#phoneGlass)"/>
                        <rect x="75" y="30" width="70" height="20" rx="10" fill="#000"/>
                        <rect x="2" y="120" width="3" height="40" rx="1.5" fill="#222"/>
                        <rect x="215" y="150" width="3" height="70" rx="1.5" fill="#222"/>
                    </svg>
                </div>
                <div class="device-label">Child's Phone</div>
            </div>

            <div class="device-circle device-1" data-device="laptop">
                <div class="device-svg-container laptop-container">
                    <svg viewBox="0 0 400 240" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <!-- Metallic Aluminum Gradient -->
                            <linearGradient id="laptopMetal" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" style="stop-color:#4a4a4a;stop-opacity:1" />
                                <stop offset="5%" style="stop-color:#3a3a3a;stop-opacity:1" />
                                <stop offset="95%" style="stop-color:#2a2a2a;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
                            </linearGradient>
                            <!-- Glossy Screen Reflection -->
                            <linearGradient id="screenGlass" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.1" />
                                <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.02" />
                                <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
                            </linearGradient>
                        </defs>
                        
                        <!-- Base/Keyboard Deck -->
                        <path d="M 40 200 L 360 200 L 360 215 Q 360 225 350 225 L 50 225 Q 40 225 40 215 Z" fill="url(#laptopMetal)" />
                        <path d="M 40 200 L 360 200 L 360 205 L 40 205 Z" fill="#1a1a1a" opacity="0.5"/> <!-- Hinge Shadow -->
                        
                        <!-- Screen Lid -->
                        <rect x="50" y="20" width="300" height="185" rx="12" fill="url(#laptopMetal)" stroke="#222" stroke-width="1"/>
                        
                        <!-- Black Bezel -->
                        <rect x="52" y="22" width="296" height="181" rx="8" fill="#000"/>
                        
                        <!-- Screen Area -->
                        <rect x="56" y="26" width="288" height="173" fill="#050505"/>
                        
                        <!-- Webcam Notch Area (Simulated) -->
                        <path d="M 185 26 L 215 26 L 212 34 L 188 34 Z" fill="#000"/>
                        
                        <!-- Reflection -->
                        <path d="M 56 26 L 344 26 L 56 200 Z" fill="url(#screenGlass)"/>
                        
                        <!-- Trackpad -->
                        <rect x="160" y="208" width="80" height="12" rx="2" fill="#000" opacity="0.2"/>
                        
                        <!-- Keyboard cutout hint -->
                        <rect x="60" y="202" width="280" height="2" fill="#000" opacity="0.3"/>
                    </svg>
                </div>
                <div class="device-label">Child's Laptop</div>
            </div>

            <div class="device-circle device-2" data-device="tablet">
                <div class="device-svg-container tablet-container">
                    <svg viewBox="0 0 200 280" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="tabletMetal" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#333;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#111;stop-opacity:1" />
                            </linearGradient>
                            <linearGradient id="tabletGlass" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#fff;stop-opacity:0.08" />
                                <stop offset="100%" style="stop-color:#fff;stop-opacity:0" />
                            </linearGradient>
                        </defs>
                        <!-- Frame -->
                        <rect x="10" y="10" width="180" height="260" rx="16" fill="url(#tabletMetal)" stroke="#2a2a2a" stroke-width="1"/>
                        <!-- Bezel -->
                        <rect x="12" y="12" width="176" height="256" rx="14" fill="#000"/>
                        <!-- Screen -->
                        <rect x="18" y="18" width="164" height="244" rx="8" fill="#050505"/>
                        <!-- Reflection -->
                        <rect x="18" y="18" width="164" height="244" rx="8" fill="url(#tabletGlass)"/>
                        <!-- Camera -->
                        <circle cx="100" cy="15" r="2" fill="#1a1a1a"/>
                        <circle cx="100" cy="15" r="1" fill="#2a3a4a"/>
                        <!-- Home Indicator -->
                        <rect x="80" y="255" width="40" height="3" rx="1.5" fill="#333"/>
                    </svg>
                </div>
                <div class="device-label">Child's Tablet</div>
            </div>

            <div class="device-circle device-3" data-device="desktop">
                <div class="device-svg-container desktop-container">
                    <svg viewBox="0 0 300 280" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="standMetal" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" style="stop-color:#2a2a2a;stop-opacity:1" />
                                <stop offset="20%" style="stop-color:#3a3a3a;stop-opacity:1" />
                                <stop offset="50%" style="stop-color:#4a4a4a;stop-opacity:1" />
                                <stop offset="80%" style="stop-color:#3a3a3a;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#2a2a2a;stop-opacity:1" />
                            </linearGradient>
                        </defs>
                        <!-- Stand Neck -->
                        <rect x="120" y="160" width="60" height="70" fill="url(#standMetal)"/>
                        <!-- Base -->
                        <path d="M 100 230 L 200 230 Q 205 230 205 235 L 205 238 Q 205 240 200 240 L 100 240 Q 95 240 95 238 L 95 235 Q 95 230 100 230 Z" fill="url(#standMetal)"/>
                        
                        <!-- Monitor Frame -->
                        <rect x="20" y="20" width="260" height="180" rx="12" fill="#000" stroke="#222" stroke-width="1"/>
                        <!-- Screen -->
                        <rect x="25" y="25" width="250" height="170" rx="4" fill="#050505"/>
                        <!-- Reflection -->
                        <path d="M 25 25 L 275 25 L 25 195 Z" fill="url(#screenGlass)"/>
                        <!-- Chin (hidden in modern all-screen designs, but adding for realism of older iMac styles or Studio Display) -->
                         <!-- Keeping it full screen black for modern look -->
                    </svg>
                </div>
                <div class="device-label">Child's Desktop</div>
            </div>

            <div class="device-circle device-4" data-device="console">
                <div class="device-svg-container console-container">
                    <svg viewBox="0 0 280 120" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="consoleMatte" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" style="stop-color:#2a2a2a;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#151515;stop-opacity:1" />
                            </linearGradient>
                        </defs>
                        <!-- Body -->
                        <rect x="20" y="30" width="240" height="60" rx="4" fill="url(#consoleMatte)" stroke="#333" stroke-width="1"/>
                        <!-- Middle Glossy Strip -->
                        <rect x="20" y="55" width="240" height="10" fill="#000" opacity="0.4"/>
                        <!-- Disc Slot -->
                        <rect x="40" y="45" width="80" height="3" rx="1.5" fill="#000" stroke="#333" stroke-width="0.5"/>
                        <!-- Power Button / LED -->
                        <circle cx="240" cy="45" r="3" fill="#333"/>
                        <circle cx="240" cy="45" r="1.5" fill="#0f0">
                            <animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/>
                        </circle>
                        <!-- Vents -->
                        <path d="M 160 30 L 180 30 L 175 90 L 155 90 Z" fill="#000" opacity="0.3"/>
                    </svg>
                </div>
                <div class="device-label">Child's Console</div>
            </div>

            <div class="device-circle device-5" data-device="watch">
                <div class="device-svg-container watch-container">
                    <svg viewBox="0 0 140 180" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="watchMetal" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#444;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#222;stop-opacity:1" />
                            </linearGradient>
                            <radialGradient id="bandTexture" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
                                <stop offset="0%" style="stop-color:#2a2a2a;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
                            </radialGradient>
                        </defs>
                        <!-- Band Top -->
                        <path d="M 45 10 L 95 10 L 90 50 L 50 50 Z" fill="url(#bandTexture)"/>
                        <!-- Band Bottom -->
                        <path d="M 50 130 L 90 130 L 95 170 L 45 170 Z" fill="url(#bandTexture)"/>
                        
                        <!-- Case -->
                        <rect x="35" y="45" width="70" height="90" rx="20" fill="url(#watchMetal)" stroke="#1a1a1a" stroke-width="1"/>
                        <!-- Screen Glass (curved edge effect) -->
                        <rect x="38" y="48" width="64" height="84" rx="18" fill="#000"/>
                        <!-- Screen Highlight -->
                        <path d="M 38 48 L 102 48 L 102 80 Q 70 90 38 80 Z" fill="#fff" opacity="0.05"/>
                        
                        <!-- Crown -->
                        <rect x="105" y="60" width="6" height="14" rx="2" fill="#333"/>
                        <rect x="105" y="85" width="4" height="14" rx="2" fill="#333"/>
                    </svg>
                </div>
                <div class="device-label">Smartwatch</div>
            </div>

        </div>

    </div>

    <!-- Templates for JS to use -->
    <template id="phone-template">
        <div class="device-svg-container phone-container parent-device">
            <svg viewBox="0 0 220 440" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="phoneFrame" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#333;stop-opacity:1" />
                        <stop offset="10%" style="stop-color:#111;stop-opacity:1" />
                        <stop offset="90%" style="stop-color:#111;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#333;stop-opacity:1" />
                    </linearGradient>
                    <linearGradient id="phoneGlass" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#fff;stop-opacity:0.05" />
                        <stop offset="40%" style="stop-color:#fff;stop-opacity:0" />
                    </linearGradient>
                </defs>
                
                <!-- Outer Frame -->
                <rect x="10" y="10" width="200" height="420" rx="45" fill="url(#phoneFrame)"/>
                <!-- Black Bezel Border -->
                <rect x="15" y="15" width="190" height="410" rx="40" fill="#000"/>
                <!-- Screen -->
                <rect x="22" y="22" width="176" height="396" rx="35" fill="#050505"/>
                
                <!-- Reflection -->
                <path d="M 22 22 L 198 22 L 22 418 Z" fill="url(#phoneGlass)"/>
                
                <!-- Dynamic Island / Notch -->
                <rect x="75" y="30" width="70" height="20" rx="10" fill="#000"/>
                
                <!-- Side Buttons -->
                <rect x="2" y="100" width="3" height="25" rx="1.5" fill="#222"/>
                <rect x="2" y="135" width="3" height="50" rx="1.5" fill="#222"/>
                <rect x="215" y="130" width="3" height="70" rx="1.5" fill="#222"/>
            </svg>
        </div>
    </template>

    <template id="laptop-template">
        <div class="device-svg-container laptop-container parent-device">
             <svg viewBox="0 0 400 240" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="laptopMetal2" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#4a4a4a;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
                    </linearGradient>
                </defs>
                <path d="M 40 200 L 360 200 L 360 215 Q 360 225 350 225 L 50 225 Q 40 225 40 215 Z" fill="url(#laptopMetal2)" />
                <rect x="50" y="20" width="300" height="185" rx="12" fill="url(#laptopMetal2)" stroke="#222" stroke-width="1"/>
                <rect x="52" y="22" width="296" height="181" rx="8" fill="#000"/>
                <rect x="56" y="26" width="288" height="173" fill="#050505"/>
                <path d="M 185 26 L 215 26 L 212 34 L 188 34 Z" fill="#000"/>
                <path d="M 56 26 L 344 26 L 56 200 Z" fill="url(#screenGlass)"/>
            </svg>
        </div>
    </template>

    <template id="desktop-template">
        <div class="device-svg-container desktop-container parent-device">
            <svg viewBox="0 0 300 280" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="standMetal2" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#2a2a2a;stop-opacity:1" />
                        <stop offset="50%" style="stop-color:#4a4a4a;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#2a2a2a;stop-opacity:1" />
                    </linearGradient>
                </defs>
                <path d="M 130 160 L 170 160 L 175 220 L 125 220 Z" fill="url(#standMetal2)"/>
                <path d="M 110 220 L 190 220 L 195 225 Q 195 230 190 230 L 110 230 Q 105 230 105 225 L 110 220 Z" fill="url(#standMetal2)"/>
                <rect x="20" y="20" width="260" height="180" rx="12" fill="#000" stroke="#222" stroke-width="1"/>
                <rect x="25" y="25" width="250" height="170" rx="4" fill="#050505"/>
                <path d="M 25 25 L 275 25 L 25 195 Z" fill="url(#screenGlass)"/>
            </svg>
        </div>
    </template>

    <script src="js/ecosystem.js"></script>
</body>
</html>
